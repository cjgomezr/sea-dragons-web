# Los checks básicos (tests, lint, tipos, build) no corrían en ningún CI: los
# corría el Stop gate del worker, en la máquina de quien lanzó la fábrica. Eso
# no cubre un PR abierto a mano ni un commit empujado después de que el gate ya
# pasó. Este workflow los hace visibles como checks del PR.
#
# Hasta el issue #149 corría sin ningún secreto, y el precio era que las
# pruebas de integración y de RLS se saltaban enteras: el check salía verde sin
# haberlas corrido. Ahora el paso de tests recibe las credenciales de
# `seadragons-dev`, y faltar deja de ser un salto silencioso para ser un fallo
# (`decideSupabaseCredentials`, en tests/support/supabase-credentials.ts).
#
# Consecuencia asumida: un PR desde un fork no recibe secretos, así que este
# check saldría rojo. Este repositorio es privado y no recibe PRs desde forks
# (ver docs/entornos.md, "CI escribe en seadragons-dev"). Si algún día los
# recibe, la decisión hay que tomarla ahí y no aquí: saltarse la suite para que
# un fork salga verde es exactamente el agujero que el #149 cerró.
#
# No puede impedir el merge: el repositorio es privado en plan gratuito y no
# admite branch protection. Hace ruidoso el fallo, no lo bloquea.
#
# `npm test` necesita chromium: no es la comparación visual vinculante (esa
# vive en visual-baselines.yml y no se toca aquí), sino que varios tests
# unitarios (tests/unit/ui-review/*, tests/unit/mockups/*) lanzan un navegador
# de verdad para capturar UI, y en un runner nuevo esa instalación no existe.
# Lo pone la acción local que lo cachea, para no bajarlo en cada corrida.
#
# No lleva filtro `paths`: dentro de `npm test` hay pruebas que leen docs/
# (tests/unit/entornos-doc.test.ts, tests/unit/prd-e2-doc.test.ts), así que un
# PR de sólo documentación puede romperlo igual que uno de código. Lo que sí se
# evita es repetir en `main` un árbol que el PR ya dejó en verde, que es de
# donde sale el gasto duplicado (issue #193).
name: checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Un merge con squash deja en `main` un commit con SHA nuevo y árbol idéntico
  # al que el PR acaba de comprobar. Este job lo averigua en segundos para que
  # el de abajo, que cuesta ocho minutos, no repita lo ya hecho. Ante cualquier
  # duda responde que no y los checks corren igual (issue #193).
  arbol-ya-verificado:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      ya_verificado: ${{ steps.pregunta.outputs.ya_verificado }}
    steps:
      - uses: actions/checkout@v4
      - id: pregunta
        run: bash scripts/checks-already-green-on-pr.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

  # Los tests de integración usan `seadragons-dev`, igual que la visual. Este
  # job espera a que ninguna corrida anterior de los dos workflows lo esté
  # usando (#507): diez jobs a la vez contra dev lo dejaban sin contestar. Va
  # aparte y no como paso de `checks` para que su nombre lo vean las demás
  # corridas. Ver scripts/wait-for-dev-turn.sh.
  #
  # `!cancelled()` y no `always()`: un push nuevo al PR cancela esta corrida,
  # y con `always()` seguiría esperando turno para nada (#416). Se salta, sin
  # ocupar sitio en la cola, cuando el árbol ya estaba verificado.
  turno-dev:
    needs: [arbol-ya-verificado]
    if: "!cancelled() && needs.arbol-ya-verificado.outputs.ya_verificado != 'true'"
    runs-on: ubuntu-latest
    # Red por si una llamada a la API se cuelga: el máximo del script sólo
    # cuenta las esperas entre consultas, y el de Actions son seis horas.
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Espera turno en seadragons-dev
        run: bash scripts/wait-for-dev-turn.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  checks:
    needs: [arbol-ya-verificado, turno-dev]
    # Una función de estado es obligatoria: sin ella, Actions exige
    # implícitamente que la dependencia haya terminado en success(), y en un
    # pull request ese job ni siquiera arranca. Sin esto, los checks se
    # saltarían en todos los PRs, que es lo contrario de lo que se busca.
    #
    # `!cancelled()` y no `always()`: al cancelar una corrida, GitHub no corta
    # un job cuyo `if` sigue dando true. Con `always()`, un push nuevo al PR
    # dejaba los checks viejos contra dev junto a los nuevos, y la cola da por
    # libre el sitio de una corrida cancelada (#416, #507). Por la función de
    # estado hay que pedir el turno en dev a mano: arrancaría aunque la espera
    # se hubiera agotado.
    if: "!cancelled() && needs.arbol-ya-verificado.outputs.ya_verificado != 'true' && needs.turno-dev.result == 'success'"
    runs-on: ubuntu-latest
    steps:
      # Con toda la historia: el paso `texto` compara la rama con main, y el
      # checkout por defecto trae un solo commit sin merge-base con nada.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Instala el navegador que necesitan los tests de captura de UI
        uses: ./.github/actions/playwright-browsers
      # Qué comandos tiene de verdad este repositorio. La plantilla de la que
      # nace un proyecto llega con `test`, `lint`, `typecheck` y `build` sin
      # rellenar, y ahí estos pasos fallarían por no existir todavía, no por
      # trabajo mal hecho. Mismo centinela que usa el Stop gate.
      - id: repo
        name: Averigua qué comandos están configurados
        run: |
          if grep -q '{{TEST_CMD}}' package.json; then
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
          fi
          if jq -e '.scripts["test:kit"] // empty' package.json > /dev/null; then
            echo "has_kit=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_kit=false" >> "$GITHUB_OUTPUT"
          fi
      # Los tests del kit no dependen del bootstrap: vigilan las piezas de la
      # fábrica, que son iguales en todos los proyectos.
      - name: Tests del kit
        if: steps.repo.outputs.has_kit == 'true'
        run: npm run test:kit
      # Un PR que solo cambia texto (.github/text-only-paths.txt) no puede
      # romper un test de red, y cada corrida completa son unos 40.000 viajes
      # a seadragons-dev (#439). Solo en pull_request: en un push a main el
      # paso no corre, la salida queda vacía y los tests corren completos. Si
      # el script no puede comparar con main, responde que no es texto.
      - id: texto
        name: Averigua si el PR solo cambia texto
        if: github.event_name == 'pull_request'
        run: |
          if bash scripts/branch-is-text-only.sh; then
            echo "solo_texto=true" >> "$GITHUB_OUTPUT"
            echo "PR de solo texto: todos sus archivos están en .github/text-only-paths.txt, así que los tests de red no corren y no reciben credenciales."
          else
            echo "solo_texto=false" >> "$GITHUB_OUTPUT"
          fi
      # Las credenciales de `seadragons-dev`, y sólo en este paso: el build no
      # las necesita y la llave de servicio no tiene nada que hacer cerca de un
      # bundle. Sin ellas, las pruebas de integración y de RLS se saltan
      # enteras y el check sale verde sin haberlas corrido (issue #149). Que
      # apunten al proyecto de desarrollo lo verifica el guardia de entorno
      # antes del primer test, no la confianza en quien pegó el secreto.
      #
      # `RUN_INTEGRATION_TESTS=1` porque fuera de CI esas pruebas se saltan
      # (#415): el Stop gate de cada worker las corría tras cada turno y el
      # proyecto de desarrollo se acercaba al límite de usuarios de Supabase.
      # Aquí se exigen, salvo en un PR de solo texto.
      #
      # Actions no tiene operador ternario, y `cond && '' || '1'` daría
      # siempre '1' porque la cadena vacía es falsa. Por eso la condición va
      # negada y el valor que se quiere va en medio.
      - name: Tests
        if: steps.repo.outputs.bootstrapped == 'true'
        run: npm test
        env:
          RUN_INTEGRATION_TESTS: ${{ steps.texto.outputs.solo_texto != 'true' && '1' || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.texto.outputs.solo_texto != 'true' && secrets.NEXT_PUBLIC_SUPABASE_URL || '' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.texto.outputs.solo_texto != 'true' && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.texto.outputs.solo_texto != 'true' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          STRIPE_SECRET_KEY: ${{ steps.texto.outputs.solo_texto != 'true' && secrets.STRIPE_SECRET_KEY || '' }}
          STRIPE_WEBHOOK_SECRET: ${{ steps.texto.outputs.solo_texto != 'true' && secrets.STRIPE_WEBHOOK_SECRET || '' }}
          STRIPE_PRICE_FULL: ${{ steps.texto.outputs.solo_texto != 'true' && secrets.STRIPE_PRICE_FULL || '' }}
          STRIPE_PRICE_STUDENT: ${{ steps.texto.outputs.solo_texto != 'true' && secrets.STRIPE_PRICE_STUDENT || '' }}
          STRIPE_PRICE_CASUAL_SESSION: ${{ steps.texto.outputs.solo_texto != 'true' && secrets.STRIPE_PRICE_CASUAL_SESSION || '' }}
      - name: Lint
        if: steps.repo.outputs.bootstrapped == 'true'
        run: npm run lint
      - name: Tipos
        if: steps.repo.outputs.bootstrapped == 'true'
        run: npm run typecheck
      - name: Build
        if: steps.repo.outputs.bootstrapped == 'true'
        run: npm run build
      # Después del build a propósito: lo que hay que revisar es el artefacto
      # que descarga el navegador, no el código fuente que se pretendía
      # publicar. Falla nombrando el chunk y la variable.
      - name: Bundle del navegador sin secretos
        if: steps.repo.outputs.bootstrapped == 'true'
        run: npm run check:client-bundle
