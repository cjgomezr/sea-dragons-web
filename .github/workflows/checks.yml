# Los checks básicos (tests, lint, tipos, build) no corrían en ningún CI: los
# corría el Stop gate del worker, en la máquina de quien lanzó la fábrica. Eso
# no cubre un PR abierto a mano ni un commit empujado después de que el gate ya
# pasó. Este workflow los hace visibles como checks del PR.
#
# Hasta el issue #149 corría sin ningún secreto, y el precio era que las
# pruebas de integración y de RLS se saltaban enteras: el check salía verde sin
# haberlas corrido. Ahora el paso de tests recibe las credenciales de
# `seadragons-dev`, y faltar deja de ser un salto silencioso para ser un fallo
# (`decideSupabaseCredentials`, en tests/support/supabase-credentials.ts).
#
# Consecuencia asumida: un PR desde un fork no recibe secretos, así que este
# check saldría rojo. Este repositorio es privado y no recibe PRs desde forks
# (ver docs/entornos.md, "CI escribe en seadragons-dev"). Si algún día los
# recibe, la decisión hay que tomarla ahí y no aquí: saltarse la suite para que
# un fork salga verde es exactamente el agujero que el #149 cerró.
#
# No puede impedir el merge: el repositorio es privado en plan gratuito y no
# admite branch protection. Hace ruidoso el fallo, no lo bloquea.
#
# `npm test` necesita chromium: no es la comparación visual vinculante (esa
# vive en visual-baselines.yml y no se toca aquí), sino que varios tests
# unitarios (tests/unit/ui-review/*, tests/unit/mockups/*) lanzan un navegador
# de verdad para capturar UI, y en un runner nuevo esa instalación no existe.
# Lo pone la acción local que lo cachea, para no bajarlo en cada corrida.
#
# No lleva filtro `paths`: dentro de `npm test` hay pruebas que leen docs/
# (tests/unit/entornos-doc.test.ts, tests/unit/prd-e2-doc.test.ts), así que un
# PR de sólo documentación puede romperlo igual que uno de código. Lo que sí se
# evita es repetir en `main` un árbol que el PR ya dejó en verde, que es de
# donde sale el gasto duplicado (issue #193).
name: checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Un merge con squash deja en `main` un commit con SHA nuevo y árbol idéntico
  # al que el PR acaba de comprobar. Este job lo averigua en segundos para que
  # el de abajo, que cuesta ocho minutos, no repita lo ya hecho. Ante cualquier
  # duda responde que no y los checks corren igual (issue #193).
  arbol-ya-verificado:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      ya_verificado: ${{ steps.pregunta.outputs.ya_verificado }}
    steps:
      - uses: actions/checkout@v4
      - id: pregunta
        run: bash scripts/checks-already-green-on-pr.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

  checks:
    needs: [arbol-ya-verificado]
    # `always()` es obligatorio: sin una función de estado explícita, Actions
    # exige implícitamente que la dependencia haya terminado en success(), y en
    # un pull request ese job ni siquiera arranca. Sin esto, los checks se
    # saltarían en todos los PRs, que es lo contrario de lo que se busca.
    if: always() && needs.arbol-ya-verificado.outputs.ya_verificado != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Instala el navegador que necesitan los tests de captura de UI
        uses: ./.github/actions/playwright-browsers
      # Qué comandos tiene de verdad este repositorio. La plantilla de la que
      # nace un proyecto llega con `test`, `lint`, `typecheck` y `build` sin
      # rellenar, y ahí estos pasos fallarían por no existir todavía, no por
      # trabajo mal hecho. Mismo centinela que usa el Stop gate.
      - id: repo
        name: Averigua qué comandos están configurados
        run: |
          if grep -q '{{TEST_CMD}}' package.json; then
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
          fi
          if jq -e '.scripts["test:kit"] // empty' package.json > /dev/null; then
            echo "has_kit=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_kit=false" >> "$GITHUB_OUTPUT"
          fi
      # Los tests del kit no dependen del bootstrap: vigilan las piezas de la
      # fábrica, que son iguales en todos los proyectos.
      - name: Tests del kit
        if: steps.repo.outputs.has_kit == 'true'
        run: npm run test:kit
      # Las credenciales de `seadragons-dev`, y sólo en este paso: el build no
      # las necesita y la llave de servicio no tiene nada que hacer cerca de un
      # bundle. Sin ellas, las pruebas de integración y de RLS se saltan
      # enteras y el check sale verde sin haberlas corrido (issue #149). Que
      # apunten al proyecto de desarrollo lo verifica el guardia de entorno
      # antes del primer test, no la confianza en quien pegó el secreto.
      - name: Tests
        if: steps.repo.outputs.bootstrapped == 'true'
        run: npm test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Lint
        if: steps.repo.outputs.bootstrapped == 'true'
        run: npm run lint
      - name: Tipos
        if: steps.repo.outputs.bootstrapped == 'true'
        run: npm run typecheck
      - name: Build
        if: steps.repo.outputs.bootstrapped == 'true'
        run: npm run build
      # Después del build a propósito: lo que hay que revisar es el artefacto
      # que descarga el navegador, no el código fuente que se pretendía
      # publicar. Falla nombrando el chunk y la variable.
      - name: Bundle del navegador sin secretos
        if: steps.repo.outputs.bootstrapped == 'true'
        run: npm run check:client-bundle
