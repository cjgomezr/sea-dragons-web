# La prueba de carga de NFR-001 y NFR-008 (#525, RF-7 y RF-8 del PRD de
# E16b): 50 socios con sesión recorren la aplicación durante más de 5
# minutos sobre el club grande de #524, y el job falla si el p95 pasa de 1
# segundo o los errores del 1%.
#
# Todo vive en el runner: el Supabase local de #535, el club sembrado y la
# aplicación compilada en modo producción. No pide ningún secreto ni pasa por
# la cola de seadragons-dev: nada de esto toca un proyecto compartido (D7).
#
# Se lanza a mano y una vez por semana, nunca en un PR: tarda un cuarto de
# hora y su resultado no depende del diff.
name: carga

on:
  workflow_dispatch:
  # Domingo 17:00 UTC: lunes de madrugada en Melbourne.
  schedule:
    - cron: "0 17 * * 0"

permissions:
  contents: read

concurrency:
  group: carga
  cancel-in-progress: false

jobs:
  carga:
    runs-on: ubuntu-latest
    # Supabase arranca en unos 2 minutos, el sembrado en segundos, el build en
    # 3 o 4 y k6 corre 6. Media hora es el máximo de RF-7, sembrado incluido.
    timeout-minutes: 30
    env:
      APP_URL: http://localhost:3417
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/supabase-local
      - name: Siembra el club de NFR-008
        run: npm run db:seed-load-test
      - name: Compila la aplicación en modo producción
        run: npm run build
      - name: Arranca la aplicación contra el Supabase local
        run: |
          nohup npm run start > app.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf "$APP_URL/api/v1/health" > /dev/null && exit 0
            sleep 1
          done
          echo "::error title=Prueba de carga::la aplicación no contestó en $APP_URL/api/v1/health en 60 segundos"
          tail -n 50 app.log
          exit 1
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: 2.3.0
      # Si el runner se queda sin memoria, el sistema mata k6 y este paso sale
      # en rojo; el informe de abajo dice cuánto llegó a medir.
      - name: Corre el recorrido del club con 50 usuarios
        timeout-minutes: 10
        run: k6 run --out json=carga-resultados.json scripts/load-test/club-journey.ts
      - name: Resume p50, p95 y p99 por endpoint
        if: always()
        run: npx tsx scripts/load-test/report.ts carga-resultados.json
      - name: Comprime los resultados
        if: always()
        run: |
          if [ -f carga-resultados.json ]; then gzip -k carga-resultados.json; fi
      - name: Guarda el informe completo y el log de la aplicación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carga-${{ github.run_id }}
          path: |
            carga-resultados.json.gz
            app.log
          if-no-files-found: warn
          retention-days: 30
