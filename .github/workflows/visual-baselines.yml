# La línea base visual vinculante es la de Linux, y sólo se acepta a mano.
#
# En cada PR este workflow COMPARA y nada más. No regenera, no commitea y no
# empuja. Esa es la diferencia que importa: si el job pudiera arreglar el
# desajuste por su cuenta, el commit que de verdad se mergea nunca quedaría
# validado, porque el push del bot dispararía otra corrida que habría que
# saltar para no entrar en bucle, y el rojo terminaría colgando siempre de un
# commit ya superado. Sin push no hay bucle que cerrar ni validación que
# saltarse: el check cae sobre el HEAD real del PR.
#
# Cuando la diferencia es intencionada, un humano acepta la nueva línea base
# ejecutando este mismo workflow a mano sobre la rama del PR:
#   gh workflow run visual-baselines.yml --ref <rama-de-PR> \
#     -f reviewed_run_url=<url de la corrida fallida>
# Se pide esa URL a propósito: aceptar sin haber abierto el artefacto
# `visual-diff` es dar por bueno cualquier píxel que estuviera renderizando en
# ese momento, que es justo lo que la regresión visual existe para impedir. La
# URL queda en el resumen del run, así que la decisión deja rastro.
#
# Normalmente `--ref` es una rama de PR: ahí es donde la línea base nueva
# tiene que aterrizar antes de mergear. La excepción es un `main` que ya
# quedó desajustado (el incidente que abre scripts/report-visual-incident.sh):
# ahí no hay rama de PR donde aceptar, y `--ref main` es lo correcto.
#
# Ojo con el push del job `accept`: la corrida de `compare` que dispara queda
# en `action_required` esperando aprobación, porque la empuja
# `github-actions[bot]`. Hasta que alguien la apruebe, el check no está
# verde: está sin arrancar, que no es lo mismo.
#
# Al comparar sin escribir, el job funciona igual en PRs desde un fork, donde
# GitHub degrada el token a sólo lectura pase lo que pase.
#
# El disparador `push` sobre `main` existe porque nada impide mergear con este
# check en rojo: el repo es privado en plan gratuito y no admite branch
# protection ni rulesets. No se puede evitar el desajuste, así que se lo hace
# ruidoso: si `main` queda incoherente, el job `report-incident` abre un
# issue en la cola (ver scripts/report-visual-incident.sh) en vez de dejarlo
# como una corrida roja que nadie mira hasta que otro PR salga rojo por algo
# que no era suyo.
name: Visual baselines (Linux)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Sólo lo que puede cambiar un píxel. Un PR de scripts, documentos o tests
    # unitarios no puede mover la captura, y hoy gastaba cinco minutos
    # comparándola igual (issue #193). Entran el código y sus configuraciones,
    # la suite de Playwright con su arranque de sesión, las propias líneas base,
    # las dependencias (una versión nueva de Next puede renderizar distinto), y
    # este workflow con la acción que usa, para que un cambio aquí se pueda
    # probar al hacerlo.
    #
    # `paths` es seguro mientras el repositorio no tenga branch protection: un
    # check obligatorio que no arranca deja el PR esperando un estado que nunca
    # llega. Comprobado el 16 de septiembre de 2026, el plan gratuito no la
    # ofrece en repositorios privados. Si algún día se activa, la alternativa es
    # dejar que el job arranque y salga temprano.
    paths:
      - "src/**"
      # Las dos formas porque `*` no cruza `/`: playwright.config.ts declara
      # testDir ./tests con testMatch **/*.spec.ts, así que un spec agrupado en
      # una carpeta cuenta igual que los de la raíz de tests/.
      - "tests/*.spec.ts"
      - "tests/**/*.spec.ts"
      - "tests/ui.spec.ts-snapshots/**"
      - "tests/support/**"
      - "playwright.config.ts"
      - "next.config.ts"
      - ".nvmrc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/visual-baselines.yml"
      - ".github/actions/playwright-browsers/**"
  push:
    branches: [main]
    # Las mismas de arriba, palabra por palabra: Actions no admite anclas de
    # YAML, así que la lista se repite. Un filtro distinto en cada disparador o
    # gastaría de más en main, o dejaría de vigilar en main lo que el PR sí
    # vigilaba. Hay un test que comprueba que las dos listas siguen siendo
    # iguales.
    paths:
      - "src/**"
      # Las dos formas porque `*` no cruza `/`: playwright.config.ts declara
      # testDir ./tests con testMatch **/*.spec.ts, así que un spec agrupado en
      # una carpeta cuenta igual que los de la raíz de tests/.
      - "tests/*.spec.ts"
      - "tests/**/*.spec.ts"
      - "tests/ui.spec.ts-snapshots/**"
      - "tests/support/**"
      - "playwright.config.ts"
      - "next.config.ts"
      - ".nvmrc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/visual-baselines.yml"
      - ".github/actions/playwright-browsers/**"
  workflow_dispatch:
    inputs:
      reviewed_run_url:
        description: "URL de la corrida cuyo artefacto visual-diff ya miraste"
        required: true

permissions:
  contents: read

jobs:
  # La suite se reparte en varias máquinas (#255): en una sola, comparar
  # tardaba más de 8 minutos y aceptar entre 13 y 16. Cada parte siembra sus
  # propios miembros de prueba en `seadragons-dev` con un nombre único por
  # corrida (#254), así que las partes no chocan entre sí. Más partes también
  # son más sesiones abiertas a la vez contra el límite de peticiones de
  # Supabase Auth; si ese límite empieza a hundir corridas, la salida es
  # bajar el número de partes.
  #
  # `regenerate` se reparte exactamente igual; scripts/check-shard-coverage.ts
  # lo comprueba en el job `reparto`.
  compare:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      # Que una parte falle no cancela las demás: el diff de cada una es lo
      # que alguien tiene que mirar, y una parte cancelada no deja ninguno.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/playwright-browsers
      # Playwright sirve en CI la aplicación compilada (`npm run start`, ver
      # tests/support/web-server-command.ts). Sin credenciales, igual que en
      # checks.yml: el build no las necesita.
      - name: Compila la aplicación
        # Con los secretos: al compilar, Next prerenderiza las pantallas y eso
        # ejecuta la lectura de la marca del club (#292). Sin ellos cae al
        # respaldo, y hoy no se nota sólo porque el respaldo coincide con lo
        # sembrado. En cuanto un club se renombre, las capturas saldrían con el
        # nombre viejo y la comparación fallaría sin decir por qué.
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Sólo en este paso: `npm ci` y sus postinstall no tienen nada que hacer
      # con una llave de escritura. El `npm run start` que Playwright levanta
      # sí las recibe, porque lo arranca como hijo de este proceso, y las
      # necesita: la aplicación que se fotografía vive detrás de la frontera de
      # sesión.
      - name: Compara contra la línea base vinculante
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Un nombre por parte: dos subidas con el mismo nombre chocan. El job
      # `visual-diff` las junta después en el artefacto que la gente conoce.
      - name: Guarda el diff para que alguien lo mire
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # Quien acepta una línea base busca un solo artefacto `visual-diff`, con el
  # diff de todas las partes que fallaron, cada una en su carpeta.
  visual-diff:
    needs: compare
    # `always()` por lo mismo que en `report-incident`: sin él, este job sólo
    # correría cuando `compare` salió bien, que es cuando no hay diff. Si
    # `compare` cayó antes de Playwright (en `npm ci` o en el build), ninguna
    # parte subió diff y este job también sale rojo, por no encontrar nada que
    # juntar. No esconde nada: el fallo de verdad está en `compare`.
    if: always() && needs.compare.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Junta el diff de las partes que fallaron
        uses: actions/upload-artifact/merge@v4
        with:
          name: visual-diff
          pattern: visual-diff-*
          separate-directories: true
          retention-days: 14
          delete-merged: true

  # Las partes tienen que sumar la suite entera: una prueba que no cae en
  # ninguna nunca se compara, y el check saldría verde sin haberla visto.
  # Sólo lista las pruebas, sin correrlas, así que no necesita credenciales.
  reparto:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Comprueba que las partes suman la suite entera
        run: npm run check:shards

  report-incident:
    needs: compare
    # `always()` es obligatorio: sin una función de estado explícita, Actions
    # exige implícitamente que `compare` (su única dependencia) haya
    # terminado en success(), así que este job nunca correría cuando
    # compare falla si sólo se compara needs.compare.result.
    if: always() && github.event_name == 'push' && needs.compare.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      # Declarar permisos deja en `none` todo lo que no se lista. Este job
      # hace checkout para correr scripts/report-visual-incident.sh, y
      # clonar un repo privado sin contents: read falla con 403 (ver
      # labels-cleanup.yml).
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Abre (o no duplica) el incidente de main desajustado
        run: bash scripts/report-visual-incident.sh

  # Aceptar son dos jobs: `regenerate` rehace las capturas repartido en
  # partes, con las credenciales y sin permiso de escritura; `accept` junta lo
  # que produjo cada parte y lo empuja, con permiso de escritura y sin
  # credenciales.
  #
  # Los dos parten de `github.sha`, el commit que era la punta de la rama al
  # lanzar el workflow, y no de la punta en el momento en que arranca cada
  # job. Si alguien empuja a la rama mientras se acepta, las partes siguen
  # saliendo del mismo commit, y el push de `accept` se rechaza por no ser
  # fast-forward en vez de dejar capturas viejas encima del código nuevo.
  regenerate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Una parte que falla no cancela las demás: `accept` no commitea nada si
      # alguna falló, pero su log dice cuáles, no sólo la primera.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/playwright-browsers
      - name: Compila la aplicación
        # Con los secretos: al compilar, Next prerenderiza las pantallas y eso
        # ejecuta la lectura de la marca del club (#292). Sin ellos cae al
        # respaldo, y hoy no se nota sólo porque el respaldo coincide con lo
        # sembrado. En cuanto un club se renombre, las capturas saldrían con el
        # nombre viejo y la comparación fallaría sin decir por qué.
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Regenerar es correr la misma suite: sin sesión fotografiaría la
      # pantalla de entrada en vez de la que se está aceptando.
      - name: Regenera la línea base
        id: update
        run: bash scripts/update-visual-baselines.sh --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Sólo las capturas que esta parte regeneró. Subir la carpeta entera
      # haría que la copia vieja de otra parte pisara, al juntarlas, la
      # captura nueva de ésta.
      - name: Separa las capturas regeneradas
        id: collect
        if: steps.update.outcome == 'failure'
        run: |
          mkdir -p baseline-changes
          git diff --cached --name-only --diff-filter=AM -- tests/ui.spec.ts-snapshots \
            | xargs -r cp -t baseline-changes
          if [ -z "$(ls -A baseline-changes)" ]; then
            echo "El fallo no era de píxeles: no hay línea base que aceptar." >&2
            exit 1
          fi
      - name: Sube las capturas de esta parte
        if: steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ matrix.shard }}
          path: baseline-changes/
          retention-days: 1
          if-no-files-found: error

  accept:
    needs: regenerate
    # Sin `always()` a propósito: si una parte falló por algo que no eran
    # píxeles, no se acepta nada. La línea base no se acepta a medias.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Deja constancia de qué diff se revisó
        run: |
          echo "Línea base aceptada tras revisar:" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ inputs.reviewed_run_url }}" >> "$GITHUB_STEP_SUMMARY"
      # Cada parte en su carpeta, para poder decir en el resumen cuántas
      # capturas trajo cada una antes de juntarlas.
      - uses: actions/download-artifact@v4
        with:
          pattern: baseline-*
          path: baseline-parts
      - name: Junta las capturas de todas las partes
        run: |
          shopt -s nullglob
          for part in baseline-parts/*/; do
            echo "- $(basename "$part"): $(ls "$part" | wc -l) capturas" >> "$GITHUB_STEP_SUMMARY"
            cp "$part"* tests/ui.spec.ts-snapshots/
          done
      - name: Commitea la línea base aceptada
        id: commit
        run: |
          git add tests/ui.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "La línea base ya estaba al día: no hay nada que aceptar." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Línea base visual para Linux (aceptada a mano)"
          git push origin "HEAD:${GITHUB_REF}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Avisa en el PR de que falta confirmar el check
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch="${GITHUB_REF#refs/heads/}"
          pr_number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            gh pr comment "$pr_number" --body "✅ Línea base visual aceptada y empujada a esta rama. **Todavía no mergees**: espera a que \`compare\` corra sobre este commit y salga verde. Si aparece como \`action_required\`, apruébala primero, porque la empujó un bot y GitHub no la arranca sola. Mergear antes deja \`main\` con el código nuevo y la captura vieja."
          else
            echo "No encontré un PR abierto para la rama $branch; nadie a quien avisar." >&2
          fi
