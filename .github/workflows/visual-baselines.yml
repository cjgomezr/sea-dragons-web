# Regenera la línea base visual de Linux automáticamente sobre la propia
# rama del PR que toca UI (issue #58): nadie tiene que acordarse de disparar
# nada a mano después de mergear, y como sólo CI escribe estas capturas, dos
# PR en paralelo no terminan peleándose por el mismo PNG binario.
#
# El job compara primero (scripts/update-visual-baselines.sh corre
# `playwright test` sin --update-snapshots) para que una diferencia real de
# píxeles quede visible en el log antes de tocar nada. Sólo si esa
# comparación falla se regenera y se empuja el resultado a la rama del PR;
# el job igual termina en rojo para forzar que alguien mire el diff antes de
# aceptarlo (issue #58, "que la regresión visual siga detectando cambios").
#
# El guard sobre github.actor evita el bucle: el push que este job hace
# vuelve a disparar `synchronize`, pero si quien empujó fue el propio bot no
# se vuelve a correr. El check queda en rojo hasta que un humano revisa el
# diff y empuja de nuevo.
#
# workflow_dispatch se mantiene como válvula de escape manual (por ejemplo,
# para regenerar main directamente), pero ya no es el único disparador.
#
# Asume PR del mismo repo: GitHub ignora `permissions: contents: write` en
# PRs de forks externos, así que ahí el push fallaría (el check quedaría en
# rojo igual, que es el desenlace seguro, pero sin autoarreglo). Este club no
# recibe forks hoy; si eso cambia, hace falta otro mecanismo para ese caso.
name: Visual baselines (Linux)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baselines:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compara contra la línea base y regenera si hace falta
        id: update
        run: bash scripts/update-visual-baselines.sh
        continue-on-error: true
      - name: Commitea la línea base regenerada en esta rama
        if: steps.update.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Nada que commitear: el fallo no era de píxeles."
          else
            git commit -m "Línea base visual para Linux (regenerada en CI para este PR)"
            git push
          fi
      - name: Deja el check en rojo para que alguien revise el diff
        if: steps.update.outcome == 'failure'
        run: exit 1
