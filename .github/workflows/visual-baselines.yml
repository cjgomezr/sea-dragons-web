# Las líneas base de Playwright son por plataforma: las generadas en Windows se
# llaman `-win32` y el worker de la nube (ubuntu-latest) busca `-linux`. Sin
# ellas, el Stop gate bloquea todo ticket que corra en CI. Este workflow las
# genera y las commitea. Ejecútalo a mano tras cambiar la UI en un entorno que
# no sea Linux: gh workflow run visual-baselines.yml
name: Visual baselines (Linux)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --update-snapshots
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/
          if git diff --cached --quiet; then
            echo "Sin cambios: las líneas base de Linux ya estaban al día."
            exit 0
          fi
          git commit -m "Líneas base visuales para Linux (generadas en CI)"
          git push
