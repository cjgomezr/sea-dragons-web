# Verificación temporal para el issue #102, NO es parte de la entrega: solo
# sirve para correr las dos suites de integración de ui-review en un runner
# ubuntu-latest real (Node 20, igual que checks.yml de #98) varias veces
# seguidas sobre el mismo commit, algo que no se puede reproducir en Windows.
# Se borra antes de abrir el PR final.
name: tmp-verify-102

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        run: [1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Suite de integración de tree-guard (diagnóstico)
        run: npx vitest run tests/unit/ui-review/tree-guard.integration.test.ts
