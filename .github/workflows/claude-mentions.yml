# Conversational trigger: mention @claude in any issue or comment and Claude
# responds from a GitHub runner: draft PRDs from your phone, answer questions,
# create tickets after your approval, fix small things.
# Credencial: token personal del actor (CLAUDE_TOKEN_<USUARIO>) o API key de
# equipo. Solo OWNER/MEMBER/COLLABORATOR pueden invocarlo.
name: claude-mentions

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Gate de permisos: solo OWNER/MEMBER/COLLABORATOR pueden invocar al agente.
    # Sin esto, en un repo público cualquiera abriría un issue con "@claude" y
    # obtendría ejecución con escritura en el repo y gasto de credenciales.
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.comment.author_association || github.event.issue.author_association) &&
      (
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: claude-mentions-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci || npm install   # el template no trae lockfile hasta el primer install

      - name: Read worker model from factory-models.json
        run: echo "FACTORY_MODEL=$(jq -r '.models.worker // "sonnet"' factory-models.json 2>/dev/null || echo sonnet)" >> $GITHUB_ENV

      - name: Resolver credencial del actor
        id: cred
        shell: bash
        env:
          # ── Mapa de tokens por persona: una línea por integrante del equipo.
          #    Cada quien planta el suyo: claude setup-token → gh secret set CLAUDE_TOKEN_SU_USUARIO
          TOK_CJGOMEZR: ${{ secrets.CLAUDE_TOKEN_CJGOMEZR }}
          # TOK_ANA_LOPEZ: ${{ secrets.CLAUDE_TOKEN_ANA_LOPEZ }}
          # ── Único fallback para humanos: la API key de EQUIPO (bolsa común
          #    por definición). El token común del repo NO se usa aquí: es
          #    exclusivo del cron nocturno. Sin token personal ni API key de
          #    equipo → auto-onboarding en el issue.
          DEFAULT_API: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          A="${GITHUB_ACTOR^^}"; A="${A//[^A-Z0-9]/_}"; KEY="TOK_$A"
          TOKEN="${!KEY:-}"
          if [ -n "$TOKEN" ]; then
            echo "🔑 Credencial: $KEY (token personal de $GITHUB_ACTOR)"
            { echo "oauth=$TOKEN"; echo "api="; } >> "$GITHUB_OUTPUT"
          elif [ -n "$DEFAULT_API" ]; then
            echo "🔑 Credencial: ANTHROPIC_API_KEY (API key de equipo)"
            { echo "oauth="; echo "api=$DEFAULT_API"; } >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Sin credencial::$GITHUB_ACTOR no tiene token ($KEY) y el repo no tiene fallback"
            if [ -n "${NUM:-}" ]; then
              BODY=$(printf '🔑 @%s: no encontré credencial tuya para correr la fábrica en la nube, y este repo no tiene token común.\n\nPlanta tu token personal:\n```\nclaude setup-token\ngh secret set CLAUDE_TOKEN_%s --repo %s\n```\n\nY pide que agreguen la línea `TOK_%s` al mapa de credenciales de los workflows (ver GUIA-DE-LA-FABRICA.md, Parte 8). Luego repite la mención o vuelve a poner la etiqueta.' "$GITHUB_ACTOR" "$A" "$GITHUB_REPOSITORY" "$A")
              gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$BODY" || true
            fi
            exit 1
          fi

      - name: Run Claude on the mention
        uses: anthropics/claude-code-action@v1
        env:
          # Esta corrida solo responde en el hilo, no produce código: el Stop
          # gate no tiene nada que verificar y este runner no instala Chromium
          # para los tests de integración que sí lo necesitan.
          FACTORY_GATE: "off"
        with:
          # Credencial resuelta por el paso "Resolver credencial del actor":
          # token personal del actor → API key de equipo (el token común del
          # repo NO participa aquí: es exclusivo del cron nocturno).
          claude_code_oauth_token: ${{ steps.cred.outputs.oauth }}
          anthropic_api_key: ${{ steps.cred.outputs.api }}
          claude_args: "--max-turns 50 --model ${{ env.FACTORY_MODEL }}"
          # No prompt: the action reads the @claude mention and responds in-thread.
