# Deterministic bookkeeping: when an issue closes (merge or manual), remove
# the factory queue labels so the board and the labels never contradict each
# other. No Claude involved: free, instant, runs on GitHub's token.
#
# Also keeps epics in sync with their sub-issues: closes an epic once none of
# its sub-issues are open, reopens it when one comes back. The `issues`
# events cover a sub-issue closing or reopening; they do NOT cover attaching
# an existing sub-issue to an epic by hand from the GitHub UI, since GitHub
# does not offer that as an Actions trigger. The daily `schedule` run is what
# catches that path.
name: labels-cleanup

on:
  issues:
    types: [closed, reopened]
  schedule:
    # Higiene diaria, no una alarma: solo hace algo si alguien enganchó a
    # mano un sub-issue a una épica ya cerrada desde la interfaz de GitHub.
    - cron: "17 6 * * *"

jobs:
  cleanup:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      # Declarar permisos deja en `none` todo lo que no se lista, y este job
      # ahora hace checkout para correr scripts/clear-blockers.sh. Sin esto,
      # clonar un repo privado falla con 403 y el job muere antes del script.
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      # Explícito en vez de inferido del remoto del checkout: así el script
      # apunta al repositorio correcto se corra desde donde se corra.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Remove queue labels on close
        run: |
          for l in in-progress pending needs-human ready-for-dev; do
            gh issue edit ${{ github.event.issue.number }} \
              --repo ${{ github.repository }} --remove-label "$l" 2>/dev/null || true
          done
      - uses: actions/checkout@v4
      - name: Remove blocked-by-N from dependents
        run: bash scripts/clear-blockers.sh ${{ github.event.issue.number }}

  epic-status:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync parent epic status
        run: bash scripts/sync-epic-status.sh ${{ github.event.issue.number }}

  reconcile-epics:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile every epic against its sub-issues
        run: bash scripts/reconcile-all-epics.sh
